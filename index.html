<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cable & Internet Solutions -- Clone</title>
  <meta name="description" content="Affordable home services: internet, TV bundles, and smart security." />
  <style>
    :root{--accent:#0b7cff;--bg:#f6f8fb;--card:#fff;--muted:#6b7280}
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:#0f172a}
    header{background:#fff;border-bottom:1px solid #e6eef8;position:sticky;top:0;z-index:40}
    .container{max-width:1100px;margin:0 auto;padding:20px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:40px}
    nav a{margin-left:18px;text-decoration:none;color:inherit;font-weight:600}
    .hero{display:grid;grid-template-columns:1fr 420px;gap:32px;padding:60px 0;align-items:center}
    .hero h1{font-size:36px;margin:0 0 12px}
    .hero p{color:var(--muted);margin:0 0 18px}
    .cta{display:flex;gap:12px}
    .btn{background:var(--accent);color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:700}
    .card{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 6px 20px rgba(11,124,255,0.06)}
    .services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
    .services .item{background:linear-gradient(180deg,#fff,#fbfdff);padding:18px;border-radius:10px;text-align:center}
    .subscribe{margin-top:22px}
    .subscribe input[type=text]{width:100%;padding:12px;border-radius:8px;border:1px solid #e6eef8;margin-top:8px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    footer{padding:30px 0;margin-top:36px}
    .socials a{margin-right:12px;text-decoration:none;color:var(--muted)}
    @media(max-width:960px){.hero{grid-template-columns:1fr;}.services{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
    @media(max-width:560px){.services{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
